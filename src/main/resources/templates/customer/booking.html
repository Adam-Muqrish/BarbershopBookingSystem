<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col h-screen justify-between customer-bg">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-12 flex-grow">
        <div class="bg-white rounded-md border border-gray-200 p-6 w-full max-w-5xl mx-auto">
            <h1 class="text-3xl font-bold mb-6">Book Appointment</h1>
            <form th:action="@{/booking}" method="post">
                <div class="mb-6">
                    <label class="block mb-1 font-semibold" for="booking-for">Booking For (For whom you book
                        for):</label>
                    <input id="booking-for" name="booking-for" type="text"
                        placeholder="e.g., John Doe"
                        maxlength="50"
                        pattern="^[A-Za-z][A-Za-z .'-]{1,49}$"
                        aria-describedby="booking-for-error booking-for-help"
                        class="w-full border rounded px-3 py-2" required />
                    <p id="booking-for-help" class="text-sm text-gray-500 mt-1">Enter the name of the person the
                        appointment is for.</p>
                    <span id="booking-for-error" class="hidden block text-sm text-red-600 mt-1"></span>
                </div>
                <div class="mb-6">
                    <label class="block font-semibold mb-2">Select Date:</label>
                    <input id="date" name="date" type="date" class="w-full border rounded px-3 py-2"
                        th:value="${selectedDate}" th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required />
                </div>
                <div class="mb-6">
                    <label class="block mb-1 font-semibold">Booking Time:</label>
                    <input id="selected-time" name="selected-time" type="text"
                        class="w-full border rounded px-3 py-2 mb-2 bg-gray-100" value="--:-- --" readonly />
                    <p id="slot-notice" class="hidden text-sm text-amber-600 mb-2">
                        Please select a new time slot.
                    </p>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2">
                        <th:block th:each="slot : ${slots}">
                            <label class="flex items-center space-x-1">
                                <input type="radio" name="slot" th:value="${slot}" class="slot-radio"
                                    th:disabled="${unavailableBarbersBySlot[slot] != null && unavailableBarbersBySlot[slot].size() == barbers.size()}"
                                    required />
                                <span th:text="${slot}"></span>
                            </label>
                        </th:block>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block mb-1 font-semibold" for="category">Customer Category:</label>
                    <select id="category" name="category" class="w-full border rounded px-3 py-2">
                        <option>Child</option>
                        <option>Teen</option>
                        <option>Adult</option>
                        <option>Senior</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block mb-1 font-semibold" for="barber">Select Barber:</label>
                    <select id="barber" name="barber" class="w-full border rounded px-3 py-2" required>
                        <option value="" selected disabled>-- Select Barber --</option>
                        <th:block th:each="barber : ${barbers}">
                            <option th:value="${barber.staffId}" th:text="${barber.staffName}">
                            </option>
                        </th:block>
                    </select>
                </div>
                <div class="flex">
                    <button type="submit" id="bookButton"
                        class="bg-blue-500 text-white px-5 py-2 rounded border border-blue-600 hover:bg-blue-600 transition">Book
                        Appointment</button>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:inline="javascript">
        window.BOOKING_DATA = {
            barbers: /*[[${barbers}]]*/[],
            unavailableBarbersBySlot: /*[[${unavailableBarbersBySlot}]]*/ {}
        };
    </script>
    <script th:src="@{/resources/js/booking.js}"></script>
</body>

</html>
