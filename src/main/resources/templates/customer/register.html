<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/header :: head_tags}"></th:block>
    <style>
      .form-container {
        position: relative;
        overflow: hidden;
      }

      .panel {
        width: 50%;
        height: 100%;
        position: relative;
        transition:
          opacity 0.5s,
          z-index 0.5s;
      }

      .panel.inactive {
        opacity: 0;
        z-index: 0;
        pointer-events: none;
      }

      .panel.active {
        opacity: 1;
        z-index: 2;
        pointer-events: auto;
      }

      .sliding-panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        transition:
          left 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          border-radius 0.5s;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--color-brand);
        padding: 2rem;
        border-top-left-radius: 1rem;
        border-bottom-left-radius: 1rem;
      }

      .sliding-panel.right {
        left: 50%;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        border-top-right-radius: 1rem;
        border-bottom-right-radius: 1rem;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-content {
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        padding: 3rem 2.5rem 2.5rem 2.5rem;
        text-align: center;
        position: relative;
        min-width: 320px;
        max-width: 90vw;
        animation: popin 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      @keyframes popin {
        from {
          transform: scale(0.95);
          opacity: 0;
        }

        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .modal-checkmark,
      .modal-xmark {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.2rem;
      }

      .modal-checkmark svg,
      .modal-xmark svg {
        width: 64px;
        height: 64px;
      }

      .modal-checkmark .circle {
        stroke: #22c55e;
        stroke-width: 4;
        fill: none;
        animation: checkmark-circle 0.4s ease;
      }

      .modal-checkmark .check {
        stroke: #22c55e;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: checkmark-draw 0.4s 0.2s forwards;
      }

      @keyframes checkmark-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      .modal-xmark .circle {
        stroke: #ef4444;
        stroke-width: 4;
        fill: none;
        animation: xmark-circle 0.4s ease;
      }

      .modal-xmark .x {
        stroke: #ef4444;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: xmark-draw 0.4s 0.2s forwards;
      }
    </style>
  </head>

  <body class="flex flex-col h-screen justify-between customer-bg">
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-content" id="modal-content"></div>
    </div>
    <main class="flex flex-col items-center mx-3 my-4 flex-grow justify-center">
      <div
        class="form-container bg-white rounded-md border border-gray-200 w-full max-w-3xl mx-4 md:mx-auto overflow-hidden"
        style="height: 680px"
      >
        <div class="flex w-full h-full relative">
          <div
            id="login-form-container"
            class="panel active bg-gray-100 p-8 flex flex-col justify-center"
          >
            <h2 class="text-2xl font-bold mb-6">Login</h2>
            <form
              id="login-form"
              class="space-y-4"
              th:action="@{/auth}"
              method="post"
            >
              <input type="hidden" name="action" value="login" />
              <div>
                <label class="block text-gray-700 mb-1">Email</label>
                <input
                  type="email"
                  name="email"
                  class="w-full p-2 border border-gray-300 rounded"
                  required
                />
              </div>
              <div>
                <label class="block text-gray-700 mb-1">Password</label>
                <div class="relative">
                  <input
                    type="password"
                    name="password"
                    id="loginPassword"
                    class="w-full p-2 pr-10 border border-gray-300 rounded"
                    required
                  />
                  <button
                    type="button"
                    data-target="loginPassword"
                    class="password-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                    aria-label="Show password"
                  >
                    <svg
                      class="hidden eye-icon w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      class="eye-off-icon w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                      />
                    </svg>
                  </button>
                </div>
              </div>
              <button
                type="submit"
                class="bg-[var(--color-brand)] text-white py-2 px-6 rounded-md hover:bg-gray-800 transition-colors"
              >
                Login
              </button>
              <button
                type="button"
                id="autofillTestBtn"
                class="bg-gray-200 text-gray-700 py-2 px-6 rounded-md hover:bg-gray-300 transition-colors"
              >
                Autofill Test Account
              </button>
            </form>
            <a th:href="@{/adminLogin}"
              class="block text-center mt-4 text-sm text-gray-600 hover:text-blue-600 underline">
              Staff / Admin Login
            </a>
          </div>
          <div
            id="register-form-container"
            class="panel inactive bg-gray-100 p-8 flex flex-col justify-center absolute top-0 right-0 h-full overflow-y-auto"
          >
            <h2 class="text-2xl font-bold mb-6">Register</h2>
            <form
              id="register-form"
              class="space-y-4"
              th:action="@{/auth}"
              method="post"
            >
              <input type="hidden" name="action" value="register" />
              <div>
                <label class="block text-gray-700 mb-1">Name</label>
                <input
                  type="text"
                  name="name"
                  id="registerName"
                  class="w-full p-2 border border-gray-300 rounded"
                  required
                />
                <span
                  class="field-error hidden block text-sm text-red-600 mt-1"
                  data-error-for="registerName"
                ></span>
              </div>
              <div>
                <label class="block text-gray-700 mb-1">Email</label>
                <input
                  type="email"
                  name="email"
                  id="registerEmail"
                  class="w-full p-2 border border-gray-300 rounded"
                  required
                />
                <span
                  class="field-error hidden block text-sm text-red-600 mt-1"
                  data-error-for="registerEmail"
                ></span>
              </div>
              <div>
                <label class="block text-gray-700 mb-1">Phone Number</label>
                <input
                  type="tel"
                  name="phone"
                  id="registerPhone"
                  class="w-full p-2 border border-gray-300 rounded"
                  required
                />
                <span
                  class="field-error hidden block text-sm text-red-600 mt-1"
                  data-error-for="registerPhone"
                ></span>
              </div>
              <div>
                <label class="block text-gray-700 mb-1">Password</label>
                <div class="relative">
                  <input
                    type="password"
                    name="password"
                    id="registerPassword"
                    class="w-full p-2 pr-10 border border-gray-300 rounded"
                    required
                  />
                  <button
                    type="button"
                    data-target="registerPassword"
                    class="password-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                    aria-label="Show password"
                  >
                    <svg
                      class="eye-icon w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      class="eye-off-icon w-5 h-5 hidden"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                      />
                    </svg>
                  </button>
                </div>
                <span
                  class="field-error hidden block text-sm text-red-600 mt-1"
                  data-error-for="registerPassword"
                ></span>
              </div>
              <div>
                <p class="text-xs text-gray-500 mt-2 mb-1">Password strength</p>
                <div class="flex gap-1" id="passwordStrength">
                  <div
                    class="strength-bar h-1.5 flex-1 rounded bg-gray-200 transition-colors"
                  ></div>
                  <div
                    class="strength-bar h-1.5 flex-1 rounded bg-gray-200 transition-colors"
                  ></div>
                  <div
                    class="strength-bar h-1.5 flex-1 rounded bg-gray-200 transition-colors"
                  ></div>
                  <div
                    class="strength-bar h-1.5 flex-1 rounded bg-gray-200 transition-colors"
                  ></div>
                </div>
                <p id="strengthText" class="text-xs mt-1 text-gray-500"></p>
              </div>
              <div>
                <label class="block text-gray-700 mb-1">Confirm Password</label>
                <div class="relative">
                  <input
                    type="password"
                    name="confirmPassword"
                    id="registerConfirmPassword"
                    class="w-full p-2 pr-10 border border-gray-300 rounded"
                    required
                  />
                  <button
                    type="button"
                    data-target="registerConfirmPassword"
                    class="password-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                    aria-label="Show password"
                  >
                    <svg
                      class="eye-icon w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      class="eye-off-icon w-5 h-5 hidden"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                      />
                    </svg>
                  </button>
                </div>
                <span
                  id="passwordMatch"
                  class="field-error hidden block text-sm mt-1"
                ></span>
              </div>
              <button
                type="submit"
                class="bg-black text-white py-2 px-6 rounded-md hover:bg-gray-800 transition-colors"
              >
                Register
              </button>
            </form>
          </div>
          <div id="sliding-panel" class="sliding-panel right">
            <div class="flex-1 flex flex-col items-center justify-center">
              <div class="mb-10 text-center">
                <h1 class="text-2xl font-bold mb-1 text-white">
                  HUGI BARBERSHOP
                </h1>
                <p class="text-lg text-white">Customer Account</p>
              </div>
              <button
                id="toggle-register"
                class="bg-white text-black py-2 px-10 rounded-md mb-4"
              >
                Register
              </button>
              <button
                id="toggle-login"
                class="bg-white text-black py-2 px-10 rounded-md"
                style="display: none"
              >
                Login
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script th:inline="javascript">
        window.REGISTER_DATA = {
            justLoggedIn: /*[[${justLoggedIn}]]*/ false,
            successMessage: /*[[${successMessage}]]*/ null,
            error: /*[[${error}]]*/ null
        };
    </script>
    <script th:src="@{/resources/js/register.js}"></script>
  </body>
</html>
