<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-20 flex-grow">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-5xl mx-auto">
            <h1 class="text-2xl font-bold mb-4">Profile Management</h1>
            <!-- ✅ ALERT ERROR (Tailwind CSS) -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
                <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer"
                    onclick="this.parentElement.style.display='none';">
                    <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20">
                        <title>Close</title>
                        <path
                            d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1-1.697 1.697z" />
                    </svg>
                </span>
            </div>
            <form th:action="@{/update-profile}" method="post" enctype="multipart/form-data">
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="name">Name:</label>
                    <input type="text" id="name" name="name" th:value="${customer.custName}"
                        class="w-full p-2 border rounded" required />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="email">Email:</label>
                    <input type="email" id="email" name="email" th:value="${customer.custEmail}"
                        class="w-full p-2 border rounded" required />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone" th:value="${customer.custPhoneNumber}"
                        class="w-full p-2 border rounded" required />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="image">Profile Picture:</label>
                    <div class="flex items-center gap-4 w-full p-2 border rounded bg-white">
                        <div class="flex-shrink-0">
                            <img id="imagePreview"
                                th:src="${customer.custPicture != null} ? @{'/resources/uploads/' + ${customer.custPicture}} : ''"
                                th:classappend="${customer.custPicture == null} ? ' hidden' : ''"
                                alt="Profile preview"
                                class="w-16 h-16 rounded-full object-cover border border-gray-300" />
                            <div id="imagePreviewFallback"
                                th:classappend="${customer.custPicture != null} ? ' hidden' : ''"
                                class="w-16 h-16 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center">
                                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                                </svg>
                            </div>
                        </div>
                        <div class="flex-1">
                            <label for="image"
                                class="cursor-pointer inline-block bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-600 transition text-sm">
                                Choose File
                            </label>
                            <span id="fileNameDisplay" class="text-gray-500 text-sm bg-gray-100 px-3 py-1 rounded border ml-2">No
                                file chosen</span>
                        </div>
                        <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/jpg"
                            class="hidden" />
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="password">New Password (leave blank to keep
                        current):</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" class="w-full p-2 pr-10 border rounded" style="padding-right:2.5rem;" />
                        <button type="button" data-target="password"
                            class="password-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                            aria-label="Show password">
                            <svg class="eye-icon w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="eye-off-icon w-5 h-5 hidden" fill="none" stroke="currentColor"
                                stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="confirm-password">Confirm New Password:</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" name="confirmPassword"
                            class="w-full p-2 pr-10 border rounded" style="padding-right:2.5rem;" />
                        <button type="button" data-target="confirm-password"
                            class="password-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                            aria-label="Show password">
                            <svg class="eye-icon w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="eye-off-icon w-5 h-5 hidden" fill="none" stroke="currentColor"
                                stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    <span id="passwordMatch" class="hidden block text-sm mt-1"></span>
                </div>
                <div class="flex space-x-2">
                    <button type="submit"
                        class="bg-green-500 text-white rounded py-2 px-4 flex-1 hover:bg-green-600 transition">Save
                        Changes</button>
                    <a th:href="@{/profile}"
                        class="bg-gray-300 text-black text-center px-4 py-2 rounded flex-1 hover:bg-gray-400">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        // Password visibility toggle
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.password-toggle').forEach(function (button) {
                button.addEventListener('click', function () {
                    var input = document.getElementById(button.getAttribute('data-target'));
                    if (!input) return;

                    var isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';

                    var eyeIcon = button.querySelector('.eye-icon');
                    var eyeOffIcon = button.querySelector('.eye-off-icon');
                    if (eyeIcon) eyeIcon.classList.toggle('hidden', !isPassword);
                    if (eyeOffIcon) eyeOffIcon.classList.toggle('hidden', isPassword);

                    button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            });
        });

        // 3.8 Confirm-new-password match validation
        document.addEventListener('DOMContentLoaded', function () {
            var passwordInput = document.getElementById('password');
            var confirmInput = document.getElementById('confirm-password');
            var matchSpan = document.getElementById('passwordMatch');
            if (!passwordInput || !confirmInput || !matchSpan) return;

            function updateMatch() {
                var value = confirmInput.value;
                if (!value) {
                    matchSpan.textContent = '';
                    matchSpan.classList.add('hidden');
                    confirmInput.classList.remove('border-red-500');
                    return;
                }
                if (value !== passwordInput.value) {
                    matchSpan.textContent = 'Passwords do not match.';
                    matchSpan.classList.remove('hidden', 'text-green-600');
                    matchSpan.classList.add('text-red-600');
                    confirmInput.classList.add('border-red-500');
                } else {
                    matchSpan.textContent = 'Passwords match.';
                    matchSpan.classList.remove('hidden', 'text-red-600');
                    matchSpan.classList.add('text-green-600');
                    confirmInput.classList.remove('border-red-500');
                }
            }

            passwordInput.addEventListener('input', updateMatch);
            confirmInput.addEventListener('input', updateMatch);
            confirmInput.addEventListener('blur', updateMatch);
        });

        // 3.9 Live image upload preview (equivalent of NioApp.Custom.uploadImage,
        // self-contained since customer pages don't load the admin scripts)
        document.addEventListener('DOMContentLoaded', function () {
            var fileInput = document.getElementById('image');
            if (!fileInput) return;

            var preview = document.getElementById('imagePreview');
            var fallback = document.getElementById('imagePreviewFallback');
            var fileNameDisplay = document.getElementById('fileNameDisplay');

            fileInput.addEventListener('change', function () {
                var file = this.files && this.files[0];
                fileNameDisplay.innerText = file ? file.name : 'No file chosen';
                if (!file) return;

                var allowed = ['jpg', 'jpeg', 'png'];
                var ext = (file.name.split('.').pop() || '').toLowerCase();
                if (!allowed.includes(ext)) {
                    alert(ext + ' file type not allowed. Please upload a JPG, JPEG, or PNG file.');
                    this.value = '';
                    fileNameDisplay.innerText = 'No file chosen';
                    return;
                }

                if (preview) {
                    preview.src = URL.createObjectURL(file);
                    preview.classList.remove('hidden');
                }
                if (fallback) {
                    fallback.classList.add('hidden');
                }
            });
        });
    </script>
</body>

</html>
